<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پشتیبان‌گیری QC Toolbox</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Tahoma,Arial,sans-serif;background:#f3f6fa;color:#15233c;margin:0;padding:24px}main{max-width:650px;margin:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 5px 24px #1c355016}button,a{font:inherit;border:0;border-radius:10px;padding:12px;margin:6px 0;cursor:pointer}button{background:#155db1;color:white}button:disabled{opacity:.5}a{display:inline-block;background:#e9eef5;color:#15233c;text-decoration:none}input{max-width:100%}#status{white-space:pre-wrap;line-height:1.9}small{color:#52637a}</style><link rel="stylesheet" href="foodlab-theme.css"><link rel="stylesheet" href="foodlab-design-system.css"><link rel="stylesheet" href="foodlab-operations-ui.css">
<link rel="stylesheet" href="foodlab-polish-phaseH.css">
<link rel="stylesheet" href="foodlab-accessibility-phaseI.css">
<script defer src="foodlab-theme-controls-phaseI.js"></script>
</head><body class="foodlab-backup-page"><main><h1>پشتیبان‌گیری و بازیابی</h1><p>فقط سوابق محلی برنامه؛ اطلاعات سرور و ورود کاربران در این فایل نیست.</p><button id="export">دریافت فایل پشتیبان</button><hr><div class="backup-file-picker"><label for="file">انتخاب فایل پشتیبان JSON</label><span id="fileName" aria-live="polite">هنوز فایلی انتخاب نشده است</span><input id="file" type="file" accept=".json,application/json" aria-label="انتخاب فایل پشتیبان JSON"></div><p><button id="preview">بررسی فایل</button> <button id="restore" disabled>بازیابی پس از تأیید</button></p><div id="status" role="status" aria-live="polite"></div><small>فایل پشتیبان ممکن است شامل اطلاعات کاری باشد؛ آن را در محل امن نگهداری کنید. قبل از بازیابی، از داده‌های فعلی پشتیبان بگیرید.</small><p><a href="index.html">بازگشت به صفحه اصلی</a></p></main><script>
'use strict';
const FIXED=new Set(['qc-export-history-v2','qc-custom-checklist','qc-checklist-templates','qc-inspection-records-v1','qc-lab-history-v2']);
const permitted=k=>FIXED.has(k)||(k.startsWith('qc-checklist-progress:')&&k.length>22&&k.length<220)||/^qc-notepad-[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}$/.test(k);
const status=document.getElementById('status'),file=document.getElementById('file'),restore=document.getElementById('restore');let pending=null;
function collect(){const data={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(permitted(k))data[k]=localStorage.getItem(k)}return data}
function validate(payload){if(!payload||payload.version!==1)throw Error('نسخه فایل نامعتبر است');const data=payload.format==='qc-toolbox-backup'?payload.data:payload.format==='qc-toolbox-local-backup'?payload.records:null;if(!data||typeof data!=='object'||Array.isArray(data))throw Error('قالب پشتیبان ناشناخته است');const entries=Object.entries(data);if(entries.length>1000||entries.some(([k,v])=>!permitted(k)||typeof v!=='string'||v.length>2e6))throw Error('کلید یا مقدار نامعتبر است');return data}
function download(data){const blob=new Blob([JSON.stringify({format:'qc-toolbox-local-backup',version:1,createdAt:new Date().toISOString(),records:data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='qc-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
document.getElementById('export').onclick=()=>{try{const data=collect();download(data);status.textContent='پشتیبان '+Object.keys(data).length+' بخش تهیه شد.'}catch(e){status.textContent='خطا در تهیه پشتیبان: '+e.message}};
file.onchange=()=>{pending=null;restore.disabled=true;const nameNode=document.getElementById('fileName');if(nameNode)nameNode.textContent=file.files&&file.files[0]?file.files[0].name:'هنوز فایلی انتخاب نشده است';status.textContent='برای بررسی فایل، دکمه بررسی را بزنید.'};
document.getElementById('preview').onclick=async()=>{pending=null;restore.disabled=true;try{const f=file.files[0];if(!f)throw Error('فایل انتخاب نشده است');if(f.size>5*1024*1024)throw Error('حجم فایل بیش از ۵ مگابایت است');pending=validate(JSON.parse(await f.text()));status.textContent='فایل معتبر است. تعداد بخش‌ها: '+Object.keys(pending).length+'\nبازیابی، مقادیر هم‌نام فعلی را جایگزین می‌کند.';restore.disabled=false}catch(e){status.textContent='خطا: '+e.message}};
restore.onclick=()=>{if(!pending)return;const entries=Object.entries(pending);if(!confirm('آیا از جایگزینی '+entries.length+' بخش اطمینان دارید؟'))return;const previous=new Map();try{for(const [k] of entries)previous.set(k,localStorage.getItem(k));for(const [k,v] of entries)localStorage.setItem(k,v);pending=null;restore.disabled=true;status.textContent='بازیابی انجام شد. برای مشاهده اطلاعات جدید، صفحات برنامه را دوباره باز کنید.'}catch(e){let rollbackOK=true;for(const [k,v] of previous){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(_){rollbackOK=false}}status.textContent='بازیابی ناموفق بود. '+(rollbackOK?'مقادیر قبلی بازگردانده شدند.':'بازگردانی کامل ممکن نشد؛ از پشتیبان قبلی استفاده کنید.')+' '+e.message}};
</script></body></html>
