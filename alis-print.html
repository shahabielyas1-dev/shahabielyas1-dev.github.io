<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فرم اعلام اطلاعات چاپ — آلیس، بازنگری ۵</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf0f4;color:#12303c;font:16px Tahoma,Arial,sans-serif}.editor{max-width:760px;margin:16px auto;padding:18px;background:#fff;border-radius:16px;box-shadow:0 2px 14px #1233}.editor h1{font-size:21px;margin:0 0 12px}.editor p{line-height:1.8;font-size:13px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13px}.field input,.field select{width:100%;height:47px;border:1.5px solid #9eb3c1;border-radius:9px;padding:7px 10px;background:white;color:#12303c;font:16px Tahoma,Arial,sans-serif}.field input:focus,.field select:focus{outline:3px solid #83d5dd}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}.checks label{border:1px solid #c3d1d8;padding:10px;border-radius:10px;line-height:1.8;font-size:13px}.checks input{width:21px;height:21px;vertical-align:middle;accent-color:#087b87}.actions{display:flex;gap:10px;flex-wrap:wrap}button,.back{border:0;border-radius:11px;background:#0b6375;color:#fff;padding:13px 18px;font:700 15px Tahoma,Arial;cursor:pointer}.back{background:#e1ebf0;color:#153947;text-decoration:none}button:disabled{opacity:.45;cursor:not-allowed}.error{color:#a52222;font-weight:700}.paperwrap{margin:18px auto 30px;width:var(--pw,148mm);height:var(--ph,210mm);position:relative}.paper{width:148mm;height:210mm;position:absolute;top:0;left:0;transform:scale(var(--scale,1));transform-origin:top left;background:white;overflow:hidden;box-shadow:0 3px 20px #18334b44;direction:ltr}.template{position:absolute;inset:0;width:100%;height:100%;display:block}.value{position:absolute;display:flex;justify-content:center;align-items:center;text-align:center;white-space:nowrap;overflow:hidden;direction:rtl;font:700 10pt Tahoma,Arial,sans-serif;color:#000;line-height:1.05;padding:0 1mm}.value.ltr{direction:ltr;font:800 11pt Arial,sans-serif}.value.tiny{font-size:8pt}.value.check{font-size:11pt;color:#000}.value.prices{font-size:10pt}.value.time{font-size:10pt}.value:not(.check){font-variant-numeric:tabular-nums}@media(max-width:600px){.editor{margin:8px;padding:14px}.fields{grid-template-columns:1fr}.checks{grid-template-columns:1fr}}@page{size:A5 portrait;margin:0}@media print{html,body{width:148mm;height:210mm;background:#fff!important;margin:0!important;padding:0!important}.editor{display:none!important}.paperwrap{width:148mm!important;height:210mm!important;margin:0!important}.paper{transform:none!important;box-shadow:none!important;position:relative!important}.template{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><section class="editor" dir="rtl"><h1>فرم رسمی چاپ آلیس — بازنگری ۵</h1><p>اطلاعات از محاسبات فعلی برنامه و قیمت‌های دریافت‌شده از سرور منتقل شده‌اند؛ نیازی به ورود مجدد نیست.</p><div id="calculated" style="line-height:2;overflow-wrap:anywhere"></div><p id="status" role="status"></p><div class="actions"><button id="print" disabled>چاپ فرم A5</button><a class="back" href="qc-dairy-v2.html">بازگشت به تولید و انقضا</a></div></section>
<div class="paperwrap" id="wrap"><main class="paper" id="paper"><img class="template" id="template" src="alis-form-revision5-a5.png" alt="فرم رسمی آلیس بازنگری ۵">
<!-- positions are percentages of the exact A5 company PDF -->







<!-- the three signature/approval rows at bottom remain entirely untouched -->

<div class="value ltr" id="fillerStamp" style="left:61%;top:19%;width:32%;height:11%;font-size:10pt;white-space:normal;overflow-wrap:anywhere"></div>
<div class="value ltr" id="sleeveStamp" style="left:6%;top:19%;width:49%;height:11%;font-size:10pt;white-space:normal;overflow-wrap:anywhere"></div>
<div class="value" id="reportDate" style="left:60%;top:11.7%;width:12.8%;height:3.1%"></div>
<div class="value" id="shift" style="left:34%;top:11.7%;width:11%;height:3.1%"></div>
<div class="value tiny" id="product" style="left:74%;top:49%;width:20%;height:2%"></div>
<div class="value" id="size" style="left:62%;top:49%;width:10%;height:2%"></div>
<div class="value prices" id="producer" style="left:8%;top:32%;width:42%;height:4%;font-size:9pt"></div>
<div class="value prices" id="consumer" style="left:8%;top:37%;width:42%;height:4%;font-size:9pt"></div>
</main></div>
<script>(function(){'use strict';
const p=new URLSearchParams(location.search),$=id=>document.getElementById(id);
const rules={prod:/^\d{4}\/\d{2}\/\d{2}$/,exp:/^\d{4}\/\d{2}\/\d{2}$/,batch:/^[A-Z0-9]{6,16}$/,producer:/^\d{1,11}$/,consumer:/^\d{1,11}$/,shift:/^[123]$/,letter:/^[A-Z]$/,size:/^(200|1000)$/};
const valid=Object.entries(rules).every(([k,r])=>r.test(p.get(k)||''))&&!!p.get('product')&&p.get('product').length<=50&&!/[<>]/.test(p.get('product'));
const fa=v=>String(v).replace(/\d/g,n=>'۰۱۲۳۴۵۶۷۸۹'[+n]);
function write(id,v){$(id).textContent=v}
if(valid){
const prod=p.get('prod'),exp=p.get('exp'),batch=p.get('batch'),product=p.get('product');
const producer=Number(p.get('producer')).toLocaleString('en-US'),consumer=Number(p.get('consumer')).toLocaleString('en-US');
write('reportDate',fa(prod));write('shift',fa(p.get('shift')));write('product',product);write('size',fa(p.get('size')));
write('fillerStamp','P:'+prod+'   E:'+exp+'   BN:'+batch);
write('sleeveStamp','P:'+prod+'   E:'+exp+'   BN:'+batch);
write('producer','ق.ت: '+fa(producer)+' ریال');write('consumer','ق.م: '+fa(consumer)+' ریال');
$('calculated').textContent='تولید: '+fa(prod)+' | انقضا: '+fa(exp)+' | بچ: '+batch+' | قیمت تولیدکننده: '+fa(producer)+' ریال | قیمت مصرف‌کننده: '+fa(consumer)+' ریال';
}
const img=$('template'),btn=$('print');function check(){const ok=valid&&img.complete&&img.naturalWidth>0;btn.disabled=!ok;$('status').textContent=!valid?'اطلاعات محاسبه‌شده ناقص است. از صفحه تولید و انقضا مجدداً فرم را باز کنید.':!img.naturalWidth?'تصویر فرم رسمی بارگذاری نشده است.':'آماده چاپ A5؛ خانه‌های امضا برای تکمیل دستی خالی هستند.'}
img.addEventListener('load',check);img.addEventListener('error',check);btn.addEventListener('click',()=>{check();if(!btn.disabled)window.print()});
function scale(){const w=148*96/25.4,s=Math.min(1,(document.documentElement.clientWidth-16)/w);document.documentElement.style.setProperty('--scale',s);document.documentElement.style.setProperty('--pw',w*s+'px');document.documentElement.style.setProperty('--ph',210*96/25.4*s+'px')};window.addEventListener('resize',scale);scale();check();
})();</script></body></html>
