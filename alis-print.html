<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فرم رسمی اعلام اطلاعات چاپ آلیس | A5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--preview-scale:1;--preview-width:559px;--preview-height:794px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#edf2f5;color:#172b35;font-family:Vazirmatn,Tahoma,Arial,sans-serif}
.toolbar{width:min(760px,calc(100% - 24px));margin:16px auto;padding:16px 18px;background:#fff;border:1px solid #d8e2e8;border-radius:14px;box-shadow:0 4px 18px #18394a12}
.toolbar h1{font-size:18px;line-height:1.7;margin:0 0 5px;font-weight:900}
.toolbar p{font-size:13px;line-height:1.9;margin:4px 0;color:#49616d}
.summary{display:flex;flex-wrap:wrap;gap:7px 18px;margin:10px 0;padding:10px 12px;background:#f4f8fa;border-radius:9px;font-size:13px;font-weight:700}
.summary span{white-space:nowrap}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
button,.back{font:800 14px Vazirmatn,Tahoma,sans-serif;border:0;border-radius:9px;padding:11px 18px;min-height:44px;text-decoration:none;cursor:pointer}
button{background:#126b78;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.back{background:#e8eff3;color:#193b49;display:inline-flex;align-items:center}
#status{font-size:13px;font-weight:700;color:#315765}
#status.error{color:#a12d2d}
.sheet-wrap{width:var(--preview-width);height:var(--preview-height);position:relative;margin:18px auto 32px}
.sheet{position:absolute;top:0;left:0;width:148mm;height:210mm;transform:scale(var(--preview-scale));transform-origin:top left;background:#fff;overflow:hidden;box-shadow:0 5px 22px #102c3b35;direction:ltr}
.template{position:absolute;inset:0;width:100%;height:100%;display:block}
.field{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;color:#050505;overflow:hidden;line-height:1.12;padding:0 1mm;font-family:Vazirmatn,Tahoma,Arial,sans-serif;font-weight:900;direction:rtl;font-variant-numeric:tabular-nums}
/* Header values */
#shiftValue{left:3.82%;top:11.76%;width:43.28%;height:3.55%;font-size:11.5pt}
#todayValue{left:61.01%;top:11.76%;width:13.92%;height:3.55%;font:800 10.5pt Arial,sans-serif;direction:ltr}
/* Filler printer: production, expiry and batch */
.stamp{direction:ltr;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:2mm;font:800 15pt Arial,sans-serif;white-space:nowrap}
#productionStamp{left:61.1%;top:19.34%;width:35.5%;height:6.18%}
#expiryStamp{left:61.1%;top:25.72%;width:35.5%;height:5.85%}
#batchStamp{left:61.1%;top:31.7%;width:35.5%;height:4.5%;font-size:13.5pt}
/* Sleeve printer prices: source values are the exact values passed from qc-dairy-v2 */
.price{left:3.82%;width:57.3%;display:flex;flex-direction:row;direction:rtl;gap:2mm;align-items:center;justify-content:center;font-size:15.5pt;white-space:nowrap}
#producerPrice{top:19.34%;height:6.18%}
#consumerPrice{top:25.72%;height:5.85%}
.price-label{font-family:Vazirmatn,Tahoma,sans-serif;font-weight:900}
.price-amount{font-family:Arial,Vazirmatn,sans-serif;font-weight:900;direction:ltr;unicode-bidi:isolate}
/* Product/body-printer information */
#productLetter{left:33.2%;top:42.65%;width:27.9%;height:4.56%;font:900 14pt Arial,sans-serif;direction:ltr}
#bottleSize{left:3.82%;top:49.56%;width:43.28%;height:2.68%;font:900 12pt Arial,sans-serif;direction:ltr}
#productName{left:61.1%;top:49.56%;width:13.92%;height:2.68%;font-size:7.2pt;line-height:1.05;white-space:normal;overflow-wrap:anywhere;padding:0 1px}
@media(max-width:600px){.toolbar{margin:8px auto;padding:13px}.toolbar h1{font-size:16px}.toolbar p{font-size:12px}.summary{font-size:12px}.sheet-wrap{margin-top:12px}}
@page{size:A5 portrait;margin:0}
@media print{
 html,body{width:148mm!important;height:210mm!important;margin:0!important;padding:0!important;background:#fff!important;overflow:hidden!important}
 .toolbar{display:none!important}
 .sheet-wrap{width:148mm!important;height:210mm!important;margin:0!important}
 .sheet{position:relative!important;left:0!important;top:0!important;transform:none!important;width:148mm!important;height:210mm!important;box-shadow:none!important;overflow:hidden!important}
 .template{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<section class="toolbar" dir="rtl">
  <h1>فرم رسمی اعلام اطلاعات چاپ — آلیس، بازنگری ۵</h1>
  <p>تمام مقادیر زیر مستقیماً از محاسبات صفحه تولید و انقضا و قیمت‌های همان نشست برنامه دریافت شده‌اند. هیچ ورود مجددی لازم نیست.</p>
  <div class="summary" id="summary" aria-live="polite"></div>
  <p id="status" role="status"></p>
  <div class="actions"><button id="printButton" type="button" disabled>چاپ فرم A5</button><a class="back" href="qc-dairy-v2.html">بازگشت به تولید و انقضا</a></div>
</section>
<div class="sheet-wrap" id="sheetWrap">
 <main class="sheet" id="sheet" aria-label="فرم رسمی آلیس در اندازه A5">
  <img class="template" id="template" src="alis-form-revision5-a5.png" alt="قالب رسمی فرم آلیس، بازنگری ۵">
  <div class="field" id="shiftValue"></div>
  <div class="field" id="todayValue"></div>
  <div class="field stamp" id="productionStamp"><span>P:</span><bdi id="productionDate" dir="ltr"></bdi></div>
  <div class="field stamp" id="expiryStamp"><span>E:</span><bdi id="expiryDate" dir="ltr"></bdi></div>
  <div class="field stamp" id="batchStamp"><span>BN:</span><bdi id="batchCode" dir="ltr"></bdi></div>
  <div class="field price" id="producerPrice"><span class="price-label">ق.ت:</span><bdi class="price-amount" id="producerAmount" dir="ltr"></bdi></div>
  <div class="field price" id="consumerPrice"><span class="price-label">ق.م:</span><bdi class="price-amount" id="consumerAmount" dir="ltr"></bdi></div>
  <div class="field" id="productLetter"></div>
  <div class="field" id="bottleSize"></div>
  <div class="field" id="productName"></div>
  <!-- بخش تأیید و هر سه محل امضا عمداً بدون نوشته باقی می‌مانند تا دستی تکمیل شوند. -->
 </main>
</div>
<script>
(function(){
 'use strict';
 const params=new URLSearchParams(window.location.search);
 const $=id=>document.getElementById(id);
 const values={
  production:params.get('prod')||'', expiry:params.get('exp')||'', batch:params.get('batch')||'',
  product:params.get('product')||'', size:params.get('size')||'', shift:params.get('shift')||'',
  letter:params.get('letter')||'', producer:params.get('producer')||'', consumer:params.get('consumer')||''
 };
 const dateOK=v=>/^\d{4}\/\d{2}\/\d{2}$/.test(v)&&Number(v.slice(5,7))>=1&&Number(v.slice(5,7))<=12&&Number(v.slice(8,10))>=1&&Number(v.slice(8,10))<=31;
 const priceOK=v=>/^\d{1,15}$/.test(v)&&Number.isSafeInteger(Number(v))&&Number(v)>=0;
 const valid=dateOK(values.production)&&dateOK(values.expiry)&&/^[A-Z0-9]{6,16}$/.test(values.batch)&&values.product.length>0&&values.product.length<=50&&!/[<>]/.test(values.product)&&/^(200|1000)$/.test(values.size)&&/^[123]$/.test(values.shift)&&/^[A-Z]$/.test(values.letter)&&priceOK(values.producer)&&priceOK(values.consumer);
 const fa=value=>String(value).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)]);
 const money=value=>fa(Number(value).toLocaleString('en-US'));
 function put(id,value){$(id).textContent=value;}
 if(valid){
  put('shiftValue',fa(values.shift));
  put('todayValue',values.production);
  put('productionDate',values.production);
  put('expiryDate',values.expiry);
  put('batchCode',values.batch);
  put('producerAmount','R: '+money(values.producer));
  put('consumerAmount','R: '+money(values.consumer));
  put('productLetter',values.letter);
  put('bottleSize',values.size);
  put('productName',values.product);
  $('summary').innerHTML='';
  const summaryItems=[['محصول',values.product],['تولید',fa(values.production)],['انقضا',fa(values.expiry)],['کد بچ',values.batch],['قیمت تولیدکننده',money(values.producer)+' ریال'],['قیمت مصرف‌کننده',money(values.consumer)+' ریال'],['شیفت',fa(values.shift)]];
  summaryItems.forEach(([label,value])=>{const span=document.createElement('span');span.textContent=label+' : '+value;$('summary').appendChild(span);});
 }else{
  $('summary').textContent='اطلاعات دریافتی از صفحه محاسبات ناقص یا نامعتبر است.';
 }
 const image=$('template'),button=$('printButton'),status=$('status');
 function refresh(){
  const imageReady=image.complete&&image.naturalWidth>0;
  button.disabled=!(valid&&imageReady);
  status.className=valid&&imageReady?'':'error';
  status.textContent=!valid?'اطلاعات فرم معتبر نیست؛ به صفحه تولید و انقضا برگردید و دوباره فرم را باز کنید.':!imageReady?'قالب رسمی فرم بارگذاری نشده است؛ چاپ غیرفعال است.':'آماده چاپ A5 عمودی؛ قیمت‌ها و تاریخ‌ها از محاسبات برنامه منتقل شده‌اند و محل امضاها خالی است.';
 }
 image.addEventListener('load',refresh);image.addEventListener('error',refresh);
 function resizePreview(){
  const baseWidth=148*96/25.4,baseHeight=210*96/25.4;
  const scale=Math.min(1,Math.max(.2,(window.innerWidth-20)/baseWidth));
  document.documentElement.style.setProperty('--preview-scale',String(scale));
  document.documentElement.style.setProperty('--preview-width',(baseWidth*scale)+'px');
  document.documentElement.style.setProperty('--preview-height',(baseHeight*scale)+'px');
 }
 window.addEventListener('resize',resizePreview);resizePreview();refresh();
 button.addEventListener('click',async()=>{
  refresh();if(button.disabled)return;
  button.disabled=true;
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;}catch(_){ }
  refresh();if(!button.disabled)window.print();
 });
})();
</script>
</body>
</html>
