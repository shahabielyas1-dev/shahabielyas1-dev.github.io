  :root{--paper-width:148mm;--paper-height:210mm;--pdf-w:419.52;--pdf-h:595.32}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#eee7d2;color:#18140d;font-family:Vazirmatn,Tahoma,sans-serif}
  .toolbar{width:min(100%,900px);max-width:900px;box-sizing:border-box;margin:0 auto;padding:18px 16px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .toolbar h1{font-size:16px;margin:0;flex:1;min-width:210px}
  button,a.btn{font:700 13px Vazirmatn,Tahoma,sans-serif;appearance:none;background:#37b34a;border:2px solid #18140d;border-radius:10px;color:#18140d;padding:10px 14px;cursor:pointer;text-decoration:none}
  a.btn{background:#fffdf6}
  .note{width:min(100%,900px);max-width:900px;box-sizing:border-box;margin:0 auto;padding:4px 16px 16px;color:#655b4e;font-size:12px;line-height:2}
  .note.error{color:#b32919}
  .preview-stage{width:100%;max-width:100vw;box-sizing:border-box;margin:0 auto 28px;padding:0 12px;display:flex;justify-content:center;overflow:hidden}
  .preview-holder{position:relative;width:var(--preview-width,148mm);height:var(--preview-height,210mm);max-width:100%;flex:none;direction:ltr}
  .paper{position:absolute;inset:0 auto auto 0;width:var(--paper-width);height:var(--paper-height);transform:scale(var(--preview-scale,1));transform-origin:top left;overflow:hidden;background:#fff;box-shadow:0 8px 32px #0002;direction:ltr}
  .template{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;user-select:none;pointer-events:none}
  .v{position:absolute;white-space:nowrap;display:flex;align-items:center;justify-content:center;line-height:1;z-index:1;color:#050505;margin:0;padding:0}
  /* Dynamic Persian words and Persian numerals are B Titr Bold. */
  .v.date-top,.v.shift,.v.bottle-size{font-family:'QC B Titr',Tahoma,sans-serif;font-weight:700}
  .v.date-top{font-size:10.2pt}
  .v.shift{font-size:10pt}
  .v.latin{font-family:Arial,'Liberation Sans',sans-serif;font-size:18pt;font-weight:900;letter-spacing:-.36pt;direction:ltr;font-variant-numeric:lining-nums tabular-nums}
  .v.prices{font-family:'QC B Titr',Tahoma,sans-serif;font-size:16.4pt;font-weight:700;direction:ltr;gap:0;letter-spacing:-.2pt}
  .v.prices .num{direction:ltr;unicode-bidi:isolate;font-size:17.7pt}
  .v.prices .rial{font-family:Georgia,serif;font-size:16.6pt;direction:ltr}
  .v.prices .p-label{font-family:'QC B Titr',Tahoma,sans-serif;direction:rtl;font-size:15.3pt;font-weight:700}
  .v.letter{font-family:Arial,'Liberation Sans',sans-serif;font-size:18.7pt;font-weight:900}
  .v.product{font-family:'QC B Titr',Tahoma,sans-serif;font-size:8.3pt;font-weight:700;direction:rtl;letter-spacing:-.32pt}
  .v.bottle-size{font-size:9.3pt}
  html,body{max-width:100%;overflow-x:hidden}
  @media screen and (max-width:640px){
    .toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:14px 12px 8px}
    .toolbar h1{grid-column:1/-1;min-width:0;width:100%;font-size:15px;line-height:1.7}
    .toolbar button,.toolbar a.btn{min-width:0;min-height:44px;text-align:center;padding:10px 8px;font-size:12px}
    .note{padding:5px 14px 14px;font-size:11px}
    .preview-stage{padding:0 8px;margin-bottom:18px}
  }
  @page{size:A5 portrait;margin:0}
  @media print{
    html,body{margin:0!important;padding:0!important;background:#fff!important;width:148mm;height:210mm}
    .toolbar,.note{display:none!important}
    .preview-stage{display:block;width:148mm;height:210mm;margin:0;padding:0}
    .preview-holder{width:148mm;height:210mm;max-width:none}
    .paper{transform:none!important;box-shadow:none!important;position:relative}
    .template{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  }

<body class="print-preview-page">
<header class="toolbar">
  <h1>پیش‌نمایش فرم رسمی اطلاعات چاپ</h1>
  <button type="button" id="printBtn" disabled>🖨 چاپ / ذخیره PDF</button>
  <a class="btn" href="qc-dairy-v2.html">بازگشت</a>
</header>
<p id="notice" class="note">فرم بر پایه همان فایل رسمی ارسالی تولید می‌شود؛ اندازه چاپ A5، مقیاس ۱۰۰٪ و بدون حاشیه باشد. قسمت‌های امضا و کنترل باید پس از بررسی واقعی تکمیل شوند.</p>
<div class="preview-stage" id="previewStage"><div class="preview-holder" id="previewHolder"><main class="paper" id="officialPaper">
  <img class="template" src="alis-official-template.svg" alt="اصل فرم رسمی Alis-FO-QA15" id="templateImg">
  <div class="v date-top" id="reportDate" style="left:57.5%;top:14.65%;width:21.0%;height:2.45%;direction:ltr"></div>
  <div class="v shift" id="workShift" style="left:21.5%;top:14.54%;width:7%;height:2.55%"></div>
  <div class="v latin" id="prodStamp" style="left:61.45%;top:21.36%;width:35.60%;height:6.29%"></div>
  <div class="v latin" id="expStamp" style="left:61.45%;top:27.81%;width:35.60%;height:5.92%"></div>
  <div class="v latin" id="batchStamp" style="left:61.45%;top:33.90%;width:35.60%;height:5.52%"></div>
  <div class="v prices" id="producerStamp" style="left:17.5%;top:22.12%;width:29.5%;height:5.4%"><span class="num"></span><span class="rial">R</span><span class="p-label">ق.ت:</span></div>
  <div class="v prices" id="consumerStamp" style="left:17.5%;top:28.46%;width:29.5%;height:5.4%"><span class="num"></span><span class="rial">R</span><span class="p-label">ق.م:</span></div>
  <div class="v letter" id="letterStamp" style="left:43.0%;top:40.42%;width:8.2%;height:4.2%"></div>
  <div class="v product" id="productStamp" style="left:62.9%;top:47.10%;width:12.3%;height:3.01%"></div>
  <div class="v bottle-size" id="sizeStamp" style="left:20.5%;top:47.10%;width:9.2%;height:3.01%"></div>
</main></div></div>
<script>
(function(){
  'use strict';
  const p=new URLSearchParams(location.search);
  const patterns={
    prod:/^\d{4}\/\d{2}\/\d{2}$/,
    exp:/^\d{4}\/\d{2}\/\d{2}$/,
    batch:/^[A-Z0-9]{6,16}$/,
    producer:/^\d{1,11}$/,
    consumer:/^\d{1,11}$/,
    shift:/^[123]$/,
    letter:/^[A-Z]$/,
    size:/^(200|1000)$/
  };
  const fields={};let valid=true;let textFits=true;let fontsReady=false;
  for(const [k,r] of Object.entries(patterns)){
    const val=p.get(k)||'';
    if(!r.test(val)){valid=false;break;}
    fields[k]=val;
  }
  let product=p.get('product')||'';
  if(!product||product.length>28||/[<>]/.test(product))valid=false;
  const fa=s=>String(s).replace(/\d/g,n=>'۰۱۲۳۴۵۶۷۸۹'[+n]);
  const $=id=>document.getElementById(id);
  if(valid){
    // The source form uses a condensed product title without extra spaces (e.g. شیرموز).
    const displayProduct=product.replace(/\s*[۰-۹0-9]+\s*$/,'').replace(/^شیر\s+/,'شیر');
    $('reportDate').textContent=fa(fields.prod);
    $('workShift').textContent=fa(fields.shift);
    $('prodStamp').textContent='P:'+fields.prod;
    $('expStamp').textContent='E:'+fields.exp;
    $('batchStamp').textContent='BN:'+fields.batch;
    // Typography is resized only when a longer value would exceed its original cell.
    $('producerStamp').querySelector('.num').textContent=fa(Number(fields.producer).toLocaleString('en-US'));
    $('consumerStamp').querySelector('.num').textContent=fa(Number(fields.consumer).toLocaleString('en-US'));
    $('letterStamp').textContent=fields.letter;
    $('productStamp').textContent=displayProduct;
    
    $('sizeStamp').textContent=fa(fields.size);
  }else{
    $('notice').classList.add('error');
    $('notice').textContent='اطلاعات چاپ کامل نیست. از بخش «مرکز محاسبه تاریخ» محصول، شماره بچ و شیفت را انتخاب کنید.';
  }
  // No blank forms or stale data may accidentally be printed by this action.
  const image=$('templateImg');
  const printBtn=$('printBtn');
  function updateCanPrint(){printBtn.disabled=!(valid&&textFits&&fontsReady&&image.complete&&image.naturalWidth>0)}
  function fitTextIntoCells(){
    if(!valid)return;
    // Measure real glyph bounds, not just element width, so long batch codes or
    // seven-digit prices never invade adjacent cells in the printed document.
    const cells=[
      ['reportDate',10.2,8],['workShift',10,8],
      ['prodStamp',18,10],['expStamp',18,10],['batchStamp',18,9],
      ['producerStamp',16.4,9],['consumerStamp',16.4,9],
      ['letterStamp',18.7,12],['productStamp',8.3,6],['sizeStamp',9.3,7]
    ];
    textFits=true;
    for(const [id,maxPt,minPt] of cells){
      const cell=$(id);
      let size=maxPt;
      cell.style.fontSize=size+'pt';
      if(id==='producerStamp'||id==='consumerStamp'){
        // Nested spans have fixed sizes in the original form; shrink together.
        cell.querySelectorAll('span').forEach(el=>{el.style.fontSize='';});
      }
      const widthOfText=()=>{
        const range=document.createRange();range.selectNodeContents(cell);
        return range.getBoundingClientRect().width;
      };
      let needed=widthOfText();
      const available=cell.clientWidth-3;
      while(size>minPt && needed>available){
        size=Math.max(minPt,size-.3);
        cell.style.fontSize=size+'pt';
        if(id==='producerStamp'||id==='consumerStamp'){
          const ratio=size/maxPt;
          const spans=cell.querySelectorAll('span');
          const orig=[17.7,16.6,15.3];
          spans.forEach((s,i)=>s.style.fontSize=(orig[i]*ratio)+'pt');
        }
        needed=widthOfText();
      }
      if(needed>available+1){textFits=false;}
    }
    if(!textFits){
      $('notice').classList.add('error');
      $('notice').textContent='یک یا چند مقدار بیش از فضای فرم رسمی است؛ لطفاً اطلاعات محصول و قیمت‌ها را بررسی کنید.';
    }
    updateCanPrint();
  }
  // Do not permit print until the embedded B Titr Bold is truly loaded.
  (async()=>{
    try{
      if(!document.fonts)throw new Error('Font Loading API unavailable');
      await document.fonts.load('700 16px "QC B Titr"','شیر موز ۰۱۲۳۴۵۶۷۸۹');
      await document.fonts.ready;
      if(!document.fonts.check('700 16px "QC B Titr"','شیر موز ۰۱۲۳۴۵۶۷۸۹')){
        throw new Error('Embedded Persian font could not be loaded');
      }
      fontsReady=true;
      fitTextIntoCells();
      updateCanPrint();
    }catch(err){
      fontsReady=false;
      $('notice').classList.add('error');
      $('notice').textContent='فونت B Titr برای چاپ بارگذاری نشد؛ چاپ غیرفعال است. صفحه را مجدداً باز کنید.';
      updateCanPrint();
    }
  })();
  image.addEventListener('load',updateCanPrint);
  image.addEventListener('error',()=>{$('notice').classList.add('error');$('notice').textContent='قالب رسمی یافت نشد؛ فایل alis-official-template.svg باید در کنار این صفحه باشد.';updateCanPrint()});
  updateCanPrint();
  printBtn.addEventListener('click',()=>{if(valid&&textFits&&fontsReady&&image.naturalWidth>0)window.print()});
  function scalePreview(){
    // Set explicit pixel dimensions for the scaled wrapper. This avoids relying on
    // CSS calc(length * number), which is not consistently supported on mobile browsers.
    const cssPxPerMm = 96 / 25.4;
    const paperWidthPx = 148 * cssPxPerMm;
    const paperHeightPx = 210 * cssPxPerMm;
    const availableWidth = Math.max(220, document.documentElement.clientWidth - 24);
    const scale = Math.min(1, availableWidth / paperWidthPx);
    document.documentElement.style.setProperty('--preview-scale', String(scale));
    document.documentElement.style.setProperty('--preview-width', `${paperWidthPx * scale}px`);
    document.documentElement.style.setProperty('--preview-height', `${paperHeightPx * scale}px`);
  }
  window.addEventListener('resize',scalePreview,{passive:true});
  window.addEventListener('orientationchange',scalePreview,{passive:true});
  scalePreview();
})();
</script>
