<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فرم اعلام اطلاعات چاپ آلیس — A5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"BTitr";src:url("./b-titr-bold.ttf") format("truetype");font-style:normal;font-weight:700;font-display:swap}
:root{color-scheme:light;--ink:#171717;--teal:#155e68}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#edf1f3;color:#172a30;font-family:"Vazirmatn",Tahoma,Arial,sans-serif}
body{padding:14px 10px 28px}
.editor{width:min(760px,100%);margin:0 auto 16px;padding:16px 18px;background:#fff;border:1px solid #d9e1e5;border-radius:14px;box-shadow:0 5px 20px #18334b12}
.editor h1{font-size:18px;font-weight:900;margin:0 0 5px}
.editor .intro{font-size:12px;color:#52636b;line-height:1.9;margin:0 0 10px}
.summary{display:flex;flex-wrap:wrap;gap:7px 16px;padding:10px 12px;margin:8px 0 12px;background:#f4f7f8;border-radius:10px;font-size:12px;font-weight:700;line-height:1.9}
.summary span{white-space:normal}
#status{font-size:12px;line-height:1.8;margin:0 0 10px;color:#285b39;font-weight:700}
#status.error{color:#a12e27}
.actions{display:flex;gap:9px;flex-wrap:wrap}
button,.back{min-height:44px;border:0;border-radius:10px;padding:10px 17px;font:800 14px "Vazirmatn",Tahoma,Arial,sans-serif;text-decoration:none;cursor:pointer}
button{background:#145e69;color:#fff}
button:disabled{opacity:.42;cursor:not-allowed}
.back{display:inline-flex;align-items:center;background:#e9eff1;color:#29424a}
.paperwrap{position:relative;width:var(--pw,148mm);height:var(--ph,210mm);margin:0 auto;background:#fff}
.paper{position:absolute;left:0;top:0;width:148mm;height:210mm;overflow:hidden;transform:scale(var(--scale,1));transform-origin:top left;background:#fff;direction:ltr}
.template{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.value{position:absolute;z-index:2;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;color:#080808;line-height:1.08;padding:0 1mm;white-space:nowrap;font-variant-numeric:tabular-nums}
.persian{direction:rtl;font-family:"Vazirmatn",Tahoma,Arial,sans-serif;font-weight:900}
.latin{direction:ltr;font-family:Arial,"Vazirmatn",sans-serif;font-weight:800;letter-spacing:.15px}
#shift{left:3.82%;top:11.55%;width:42.42%;height:3.42%;font-size:12.5pt}
#reportDate{left:59.68%;top:11.55%;width:13.54%;height:3.42%;font-size:11.5pt}
#prodDate{left:59.68%;top:18.80%;width:34.70%;height:6.31%;font-size:15.5pt}
#expDate{left:59.68%;top:25.12%;width:34.70%;height:5.78%;font-size:15.5pt}
#batch{left:59.68%;top:30.89%;width:34.70%;height:5.30%;font-size:15.5pt}
.price{left:3.82%;width:55.86%;display:grid;grid-template-columns:max-content max-content 1fr;align-items:center;justify-items:center;direction:rtl;gap:1.5mm;font-family:"BTitr","Vazirmatn",Tahoma,Arial,sans-serif;font-size:17.5pt;font-weight:700}
.price,.price *{font-family:"BTitr","Vazirmatn",Tahoma,Arial,sans-serif;font-weight:700}
.price .label{grid-column:1;justify-self:end;direction:rtl;white-space:nowrap}
.price .r{grid-column:2;justify-self:center;direction:ltr;white-space:nowrap}
.price .amount{grid-column:3;justify-self:start;direction:ltr;unicode-bidi:isolate;letter-spacing:0;white-space:nowrap}
#producer{top:18.80%;height:6.31%}
#consumer{top:25.12%;height:5.78%}
#letter{left:32.60%;top:41.57%;width:27.07%;height:4.70%;font-size:16.5pt}
#size{left:3.82%;top:48.22%;width:42.42%;height:2.82%;font-size:14pt}
#product{left:59.68%;top:48.22%;width:13.54%;height:2.82%;font-size:12.5pt;padding:0 .5mm}
@media(max-width:600px){body{padding:8px 6px 20px}.editor{padding:13px}.editor h1{font-size:16px}.summary{gap:4px 10px}}
@page{size:A5 portrait;margin:0}
@media print{
  html,body{width:148mm!important;height:210mm!important;min-height:210mm!important;margin:0!important;padding:0!important;background:#fff!important}
  .editor{display:none!important}
  .paperwrap{width:148mm!important;height:210mm!important;margin:0!important}
  .paper{position:relative!important;left:0!important;top:0!important;transform:none!important;box-shadow:none!important}
  .template{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<section class="editor" dir="rtl">
  <h1>فرم رسمی اعلام اطلاعات چاپ آلیس</h1>
  <p class="intro">اطلاعات زیر مستقیماً از محاسبات بخش تولید و انقضا و قیمت‌های همان لحظه برنامه منتقل شده‌اند. هیچ فیلد ورود مجددی در این صفحه وجود ندارد.</p>
  <div class="summary" id="summary" aria-live="polite"></div>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="actions">
    <button id="print" type="button" disabled>چاپ فرم A5</button>
    <a class="back" href="qc-dairy-v2.html">بازگشت به تولید و انقضا</a>
  </div>
</section>
<div class="paperwrap" id="wrap">
  <main class="paper" id="paper">
    <img class="template" id="template" src="alis-form-revision5-a5.png" alt="فرم رسمی آلیس بازنگری ۵">
    <!-- Values are positioned against the original 1049 × 1489 A5 company template. -->
    <div class="value persian" id="shift"></div>
    <div class="value persian" id="reportDate"></div>
    <div class="value latin" id="prodDate"></div>
    <div class="value latin" id="expDate"></div>
    <div class="value latin" id="batch"></div>
    <div class="value price" id="producer">
      <span class="label">ق.ت:</span><span class="r">R:</span><span class="amount"></span>
    </div>
    <div class="value price" id="consumer">
      <span class="label">ق.م:</span><span class="r">R:</span><span class="amount"></span>
    </div>
    <div class="value latin" id="letter"></div>
    <div class="value persian" id="size"></div>
    <div class="value persian" id="product"></div>
    <!-- The clock fields, product checks, approval rows and signatures remain blank for manual completion. -->
  </main>
</div>
<script>
(function(){
  'use strict';
  const params=new URLSearchParams(location.search);
  const $=id=>document.getElementById(id);
  const rules={
    prod:/^\d{4}\/\d{2}\/\d{2}$/,
    exp:/^\d{4}\/\d{2}\/\d{2}$/,
    batch:/^[A-Z0-9]{6,16}$/,
    producer:/^\d{1,11}$/,
    consumer:/^\d{1,11}$/,
    shift:/^[123]$/,
    letter:/^[A-Z]$/,
    size:/^(200|1000)$/
  };
  const valid=Object.entries(rules).every(([key,rule])=>rule.test(params.get(key)||'')) &&
    !!params.get('product') && params.get('product').length<=50 && !/[<>]/.test(params.get('product'));
  const fa=value=>String(value).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)]);
  const fmt=value=>Number(value).toLocaleString('en-US');
  const set=(id,value)=>{$(id).textContent=value;};
  const img=$('template'),button=$('print'),status=$('status');
  let priceFontReady=false;
  if(document.fonts&&document.fonts.load){document.fonts.load('17.5pt BTitr').then(()=>{priceFontReady=true;checkReady();}).catch(()=>{priceFontReady=false;checkReady();});}
  if(valid){
    const prod=params.get('prod'),exp=params.get('exp'),batch=params.get('batch');
    const product=params.get('product'),shift=params.get('shift'),letter=params.get('letter');
    const producer=fmt(params.get('producer')),consumer=fmt(params.get('consumer'));
    set('shift',fa(shift));
    set('reportDate',fa(prod));
    set('prodDate','P:'+prod);
    set('expDate','E:'+exp);
    set('batch','BN:'+batch);
    $('producer').querySelector('.amount').textContent=fa(producer);
    $('consumer').querySelector('.amount').textContent=fa(consumer);
    set('letter',letter);
    set('size',fa(params.get('size')));
    set('product',product);
    const summary=$('summary');
    [
      ['تولید',fa(prod)],['انقضا',fa(exp)],['کد بچ',batch],
      ['محصول',product],['حجم',fa(params.get('size'))],
      ['شیفت',fa(shift)],['قیمت تولیدکننده',fa(producer)+' ریال'],
      ['قیمت مصرف‌کننده',fa(consumer)+' ریال']
    ].forEach(([label,value])=>{
      const item=document.createElement('span');
      item.textContent=label+': '+value;
      summary.appendChild(item);
    });
  }else{
    status.classList.add('error');
    status.textContent='اطلاعات محاسبه‌شده ناقص یا نامعتبر است. برای جلوگیری از چاپ اشتباه، فرم غیرفعال شده است؛ از صفحه تولید و انقضا دوباره فرم رسمی را باز کنید.';
  }
  function checkReady(){
    const imageReady=img.complete&&img.naturalWidth>0;
    const ready=valid&&imageReady&&priceFontReady;
    button.disabled=!ready;
    if(valid){
      status.classList.toggle('error',!imageReady);
      status.textContent=!imageReady
        ?'تصویر فرم رسمی بارگذاری نشده است؛ تا بارگذاری صحیح فرم، چاپ غیرفعال است.'
        :!priceFontReady
          ?'فونت B Titr هنوز بارگذاری نشده است؛ برای جلوگیری از چاپ با فونت جایگزین، کمی صبر کنید.'
          :'اطلاعات محاسبه‌شده آماده چاپ است. خانه‌های ساعت، تأیید و امضا مطابق نمونه برای تکمیل دستی خالی مانده‌اند.';
    }
  }
  img.addEventListener('load',checkReady);
  img.addEventListener('error',checkReady);
  button.addEventListener('click',()=>{
    checkReady();
    if(!button.disabled)window.print();
  });
  function scale(){
    const pageWidth=148*96/25.4;
    const ratio=Math.min(1,(document.documentElement.clientWidth-16)/pageWidth);
    document.documentElement.style.setProperty('--scale',ratio);
    document.documentElement.style.setProperty('--pw',(pageWidth*ratio)+'px');
    document.documentElement.style.setProperty('--ph',(210*96/25.4*ratio)+'px');
  }
  window.addEventListener('resize',scale);
  scale();
  checkReady();
})();
</script>
</body>
</html>
